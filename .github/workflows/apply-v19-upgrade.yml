name: Apply United Gimps v19 loader

on:
  push:
    paths:
      - '.github/workflows/apply-v19-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch v19 assets into loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          old_head="html=html.replace('</head>',shim+'</head>');"
          new_head="html=html.replace('</head>',shim+'<link rel=\"stylesheet\" href=\"v19.css?v=19\"></head>');"
          if old_head in s:
              s=s.replace(old_head,new_head)
          elif 'v19.css?v=19' not in s:
              raise SystemExit('Could not locate loader head injection')
          old_write="document.open();document.write(html);document.close()"
          new_write="html=html.replace('</body>','<script src=\"v19.js?v=19\"><'+'/script></body>');\ndocument.open();document.write(html);document.close()"
          if old_write in s:
              s=s.replace(old_write,new_write)
          elif 'v19.js?v=19' not in s:
              raise SystemExit('Could not locate loader document.write')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit v19 loader wiring
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/index.html)" ]; then
            echo 'Loader already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Wire United Gimps v19 five-man layer'
          git push
