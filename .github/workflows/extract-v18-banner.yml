name: Extract v18 banner asset

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-v18-banner.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact United Gimps banner
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, re
          from pathlib import Path

          parts = [
            'site/v15b64-001.txt','site/v15b64-002.txt','site/v15b64-003.txt','site/v15b64-004.txt','site/v15b64-005.txt','site/v15b64-006.txt',
            'site/v15b64-007a.txt','site/v15b64-007b.txt','site/v15b64-007c.txt','site/v15b64-008.txt',
            'site/v15b64-009a.txt','site/v15b64-009b.txt','site/v15b64-009c.txt','site/v15b64-010.txt',
            'site/v15b64-011a.txt','site/v15b64-011b.txt','site/v15b64-011c.txt',
            'site/v15b64-012a.txt','site/v15b64-012b.txt','site/v15b64-012c.txt',
            'site/v15b64-013a.txt','site/v15b64-013b.txt','site/v15b64-013c.txt',
            'site/v15b64-014a.txt','site/v15b64-014b.txt','site/v15b64-014c.txt',
            'site/v15b64-015a.txt','site/v15b64-015b.txt','site/v15b64-015c.txt','site/v15b64-016a.txt'
          ]
          docs = Path('docs')
          packed = ''.join((docs / p).read_text(encoding='utf-8').strip() for p in parts)
          html = gzip.decompress(base64.b64decode(packed)).decode('utf-8')
          m = re.search(r'class=["\']battle-art["\'][^>]*src=["\']data:image/webp;base64,([^"\']+)', html)
          if not m:
              m = re.search(r'src=["\']data:image/webp;base64,([^"\']+)["\'][^>]*class=["\']battle-art["\']', html)
          if not m:
              raise SystemExit('Could not find exact battle-art banner in v15 payload')
          out = docs / 'img' / 'united-gimps-banner.webp'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(m.group(1)))
          print('Wrote', out, out.stat().st_size, 'bytes')
          PY
      - name: Commit banner when needed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/img/united-gimps-banner.webp)" ]; then
            echo 'Banner already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/img/united-gimps-banner.webp
          git commit -m 'Restore exact United Gimps character banner'
          git push
