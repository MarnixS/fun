name: Export readable v15 source

on:
  push:
    paths:
      - '.github/workflows/export-v15-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v15 HTML
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          names=[
            'v15b64-001.txt','v15b64-002.txt','v15b64-003.txt','v15b64-004.txt','v15b64-005.txt','v15b64-006.txt',
            'v15b64-007a.txt','v15b64-007b.txt','v15b64-007c.txt','v15b64-008.txt',
            'v15b64-009a.txt','v15b64-009b.txt','v15b64-009c.txt','v15b64-010.txt',
            'v15b64-011a.txt','v15b64-011b.txt','v15b64-011c.txt',
            'v15b64-012a.txt','v15b64-012b.txt','v15b64-012c.txt',
            'v15b64-013a.txt','v15b64-013b.txt','v15b64-013c.txt',
            'v15b64-014a.txt','v15b64-014b.txt','v15b64-014c.txt',
            'v15b64-015a.txt','v15b64-015b.txt','v15b64-015c.txt','v15b64-016a.txt'
          ]
          parts=[Path('docs/site')/n for n in names]
          missing=[str(p) for p in parts if not p.exists()]
          if missing:
              raise SystemExit('Missing authoritative v15 fragments: '+', '.join(missing))
          packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(packed, validate=True)
          html=gzip.decompress(raw)
          out=Path('.scratch/v15.html')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(html)
          print(f'Reconstructed {len(html)} bytes from {len(parts)} authoritative fragments')
          PY

      - name: Commit readable source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .scratch/v15.html
          if git diff --cached --quiet; then
            echo 'Readable v15 source already current.'
            exit 0
          fi
          git commit -m 'Export readable v15 source for v19 rebuild'
          git push
