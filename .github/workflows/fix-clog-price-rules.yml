name: Fix Collection Log price rules

on:
  push:
    paths:
      - '.github/workflows/fix-clog-price-rules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Collection Log item valuation functions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/assets/v21-clog.js')
          s = p.read_text()
          old = "function price(id){if(+id===26219)return 28981998;const p=prices?.[id];if(!p)return 0;const h=+p.high,l=+p.low;return h>0&&l>0?(h+l)/2:h>0?h:l>0?l:0}"
          new = "function price(id){id=+id;const ge=x=>{const p=prices?.[x];if(!p)return 0;const h=+p.high,l=+p.low;return h>0&&l>0?(h+l)/2:h>0?h:l>0?l:0};if(id===29799)return Math.max(0,ge(29801)-ge(19553));if(id===29790||id===29792||id===29794)return ge(29796)/3;if(id===28319||id===28321||id===28323||id===28325)return ge(28338)/4;return ge(id)}"
          if old not in s:
              raise SystemExit('Exact v21-clog price function not found; refusing to change anything')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('docs/assets/app.js')
          s = p.read_text()
          old = "function priceFor(id){id=+id;if(id===29799)return 28981998;if(id===29790||id===29792||id===29794)return gePrice(29796)/3;if(id===28319||id===28321||id===28323||id===28325)return gePrice(28338)/4;return gePrice(id)}"
          new = "function priceFor(id){id=+id;if(id===29799)return Math.max(0,gePrice(29801)-gePrice(19553));if(id===29790||id===29792||id===29794)return gePrice(29796)/3;if(id===28319||id===28321||id===28323||id===28325)return gePrice(28338)/4;return gePrice(id)}"
          if old not in s:
              raise SystemExit('Exact app.js priceFor function not found; refusing to change anything')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify only valuation rules and syntax
        run: |
          grep -F "if(id===29799)return Math.max(0,ge(29801)-ge(19553))" docs/assets/v21-clog.js
          grep -F "if(id===28319||id===28321||id===28323||id===28325)return ge(28338)/4" docs/assets/v21-clog.js
          grep -F "if(id===29799)return Math.max(0,gePrice(29801)-gePrice(19553))" docs/assets/app.js
          grep -F "if(id===28319||id===28321||id===28323||id===28325)return gePrice(28338)/4" docs/assets/app.js
          node --check docs/assets/v21-clog.js
          node --check docs/assets/app.js
      - name: Commit price rules only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/v21-clog.js docs/assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Collection Log component valuations"
          git push
