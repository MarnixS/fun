name: Validate website sync
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - name: Syntax and proxy tests
        run: |
          for file in docs/assets/*.js; do node --check "$file"; done
          python scripts/build_site.py --check
          node scripts/test_ge_prices.js
          python scripts/test_refresh_ge_prices.py
          node scripts/test_chronicle_prices.js
          node scripts/test_site_origins.js
          node scripts/test_temple_proxy.js
          node scripts/test_history_model.js
          node scripts/test_player_goals.js
          node scripts/test_shared_baseline.js
          node scripts/test_clog_luck.js
          node scripts/test_chart_baseline.js
          node scripts/test_experimental_theme.js
          node scripts/test_theme_player_images.js
          node scripts/audit_hypothetical_header.js
          node scripts/test_mobile_navigation.js
          node scripts/audit_mast_overview.js
          node scripts/test_cumulative_filters.js
          node scripts/audit_cumulative_filters.js
          node scripts/test_kc_comparison.js
          node scripts/audit_stats_kc_goals.js
          node scripts/test_group_chemistry.js
          node scripts/audit_group_chemistry.js
          node scripts/audit_nemesis.js
          python scripts/check_site.py
      - name: All menus and sync regressions
        run: |
          python -m http.server 8123 --directory docs >/tmp/site-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          node scripts/audit_v25_jsdom.js
          node scripts/audit_nemesis_runtime.js
          node scripts/audit_cleanup_runtime.js
          node scripts/audit_sync.js
          node scripts/audit_live_sync.js
          node scripts/audit_chronicle_goals.js
          node scripts/audit_chart_ranges.js

          node scripts/audit_shared_goals.js
          node scripts/audit_temple_retention.js
          node scripts/audit_shared_baseline.js
          node scripts/audit_all_interactions.js
          node scripts/audit_interaction_edges.js
          node scripts/audit_activity_eras.js
          node scripts/audit_clog_beta.js
