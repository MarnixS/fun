name: Fix collection log valuation visibility

on:
  push:
    paths:
      - '.github/workflows/fix-clog-valuation-visibility.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Collection Log valuation visibility
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('docs/assets/app.js')
          s = app.read_text()
          old = "function renderClogItems(m=collectionModel()){const t=$('#clogItemTable');if(!t)return;let arr=m.rows.slice(),q=($('#clogSearch')?.value||'').toLowerCase(),status=$('#clogStatus')?.value||'all',sort=$('#clogSort')?.value||'name';"
          new = "function renderClogItems(m=collectionModel()){const t=$('#clogItemTable');if(!t)return;if(state.priceStatus==='idle')ensurePrices().then(()=>{renderClogItems();renderClogContribution();});let arr=m.rows.slice(),q=($('#clogSearch')?.value||'').toLowerCase(),status=$('#clogStatus')?.value||'all',sort=$('#clogSort')?.value||'name';"
          if old not in s:
              raise SystemExit('renderClogItems target not found')
          s = s.replace(old, new, 1)
          app.write_text(s)

          gim = Path('docs/gim.html')
          g = gim.read_text()
          oldcopy = "GE value is item price × logged quantity. Osmumten's fang uses a fixed value of 28,981,998 gp each. Untradeable or unpriced items contribute 0 gp rather than a fake estimate."
          newcopy = "GE value is item price × logged quantity. Araxyte fang uses a fixed value of 28,981,998 gp. Noxious halberd pieces use one-third of the live halberd value each, and Soulreaper axe pieces use one-quarter of the live axe value each. Other tradeable items use live GE pricing; unpriced items contribute 0 gp."
          if oldcopy not in g:
              raise SystemExit('stale valuation copy target not found')
          g = g.replace(oldcopy, newcopy, 1)
          g = g.replace('assets/app.js?v=36', 'assets/app.js?v=37')
          gim.write_text(g)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/app.js docs/gim.html
          git diff --cached --quiet && exit 0
          git commit -m "Show corrected Collection Log valuations immediately"
          git push
