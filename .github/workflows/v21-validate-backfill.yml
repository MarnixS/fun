name: Validate v21 and backfill WOM history

on:
  push:
    branches: [v21-bugfix]
    paths:
      - '.github/workflows/v21-validate-backfill.yml'

permissions:
  contents: write

concurrency:
  group: united-gimps-v21-validation
  cancel-in-progress: true

jobs:
  validate-backfill:
    if: contains(github.event.head_commit.message, '[run v21 audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-bugfix
          fetch-depth: 0
      - name: Placeholder
        run: echo 'Final audit workflow will be armed after the source pass.'
