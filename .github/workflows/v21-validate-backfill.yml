name: Validate v21 final site

on:
  push:
    branches: [v21-bugfix]
    paths: ['.github/workflows/v21-validate-backfill.yml']

permissions:
  contents: write

concurrency:
  group: united-gimps-v21-validation
  cancel-in-progress: true

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[run v21 audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v21-bugfix
          fetch-depth: 0

      - name: Finalize source
        run: python scripts/finalize_v21.py

      - name: Static audit
        shell: bash
        run: |
          set -euo pipefail
          for f in docs/assets/app.js docs/assets/v21-common.js docs/assets/v21-chartlib.js docs/assets/v21-progress.js docs/assets/v21-clog.js docs/assets/v21-nav.js; do node --check "$f"; done
          python -m py_compile scripts/refresh_shared_data.py scripts/finalize_v21.py scripts/audit_v21_browser.py
          if grep -Rqi 'dikste jr' docs scripts/refresh_shared_data.py; then echo 'stale fake member found'; exit 1; fi
          old_term='Temple catalogue'
          if grep -Rqi "$old_term" docs; then echo 'forbidden Collection Log wording found'; exit 1; fi
          if grep -q 'findNearestSnapshot(p,target,true)' docs/assets/app.js; then echo 'Time Machine still makes WOM network requests'; exit 1; fi
          grep -q 'Closest WOM snapshot in time' docs/assets/app.js
          grep -q 'id="clogMemberPicker"' docs/gim.html
          grep -q 'Reload stats Chronicle via WOM' docs/chronicle.html
          grep -q 'v21-member-fieldset' docs/assets/v21-common.js
          grep -q 'v21-skip-link' docs/assets/v21-common.js
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          pages=['index.html','gim.html','hiscores.html','progress.html','history.html','time-machine.html','chronicle.html']; expected=['Overview','Collection Log','Hiscores','XP & Progress','History','Time Machine','Chronicle']
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  for k in ('src','href'):
                      v=a.get(k,'')
                      if v and not v.startswith(('http:','https:','#','mailto:','javascript:')): self.refs.append(v.split('?')[0])
          for fn in pages:
              t=(Path('docs')/fn).read_text(); labels=re.findall(r'<a class="nav-link[^>]*><span class="nav-rune"[^>]*>[^<]*</span><span>([^<]+)</span>',t)
              assert labels==expected,(fn,labels); assert t.count('assets/v21-nav.js')==1,(fn,'nav script')
              assert 'aria-label="Primary"' in t,(fn,'primary nav label')
              p=P(); p.feed(t); assert len(p.ids)==len(set(p.ids)),(fn,'duplicate ids')
              for ref in p.refs: assert (Path('docs')/ref).exists(),(fn,'missing',ref)
          print('STATIC AUDIT PASSED')
          PY

      - name: Backfill all WOM history and refresh saved Collection Log once
        run: python scripts/refresh_shared_data.py

      - name: Deep saved-data audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          E={'dikste','big dog aura','lijpste','poep aura','lompste'}; w=json.loads(Path('docs/data/wom-cache.json').read_text()); t=json.loads(Path('docs/data/temple-clog.json').read_text())
          assert set(w['profiles'])==E; counts={k:len(w.get('snapshots',{}).get(k,[])) for k in E}; assert sum(counts.values())>=100 and all(v>=2 for v in counts.values()),counts
          for k,a in w['snapshots'].items():
              ts=[x['createdAt'] for x in a]; assert len(ts)==len(set(ts)),(k,'duplicate timestamps'); assert all(x.get('data') for x in a)
          for k in ['dikste','big dog aura','lijpste']: assert w['snapshots'][k][0]['createdAt']<'2026-01-15',(k,w['snapshots'][k][0]['createdAt'])
          assert set(t.get('players',{})).issubset(E); assert t.get('groupSize')==5; assert int(t.get('membersWithClog',0))>=4
          print('WOM snapshots',counts); print('ranges',{k:(w['snapshots'][k][0]['createdAt'],w['snapshots'][k][-1]['createdAt']) for k in E}); print('Collection Logs',t['membersWithClog'])
          PY

      - name: Full browser accessibility and interaction audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q selenium axe-selenium-python
          python -m http.server 8123 --directory docs >/tmp/http.log 2>&1 &
          server=$!; trap 'kill $server || true' EXIT; sleep 2
          python scripts/audit_v21_browser.py

      - name: Persist audited site and saved history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs scripts/refresh_shared_data.py
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'Persist fully audited v21 site and complete WOM history'
          git fetch origin v21-bugfix
          git rebase origin/v21-bugfix
          git push origin HEAD:v21-bugfix
