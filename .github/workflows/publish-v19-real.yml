name: Publish corrected United Gimps v19

on:
  push:
    paths:
      - '.v19publish/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: united-gimps-v19-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and reconstruct corrected v19
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, shutil, tarfile
          from pathlib import Path
          stage=Path('.v19publish')
          parts=sorted(stage.glob('chunk-*.txt'))
          if len(parts)!=16:
              raise SystemExit(f'Expected 16 v19 chunks, found {len(parts)}')
          packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(packed, validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          expected='190db676b5e732538aea5b0b16506844c5a35de4b1b03cc579c378cedd0f2d16'
          if sha!=expected:
              raise SystemExit(f'Payload checksum mismatch: {sha}')
          tmp=Path('.v19-unpack'); shutil.rmtree(tmp,ignore_errors=True); tmp.mkdir()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall(tmp)
          docs=Path('docs')
          (docs/'assets').mkdir(parents=True,exist_ok=True)
          for name in ['index.html','gim.html','hiscores.html','progress.html','time-machine.html','chronicle.html','history.html']:
              shutil.copy2(tmp/name,docs/name)
          shutil.copy2(tmp/'assets/app.js',docs/'assets/app.js')
          shutil.copy2(tmp/'assets/site.css',docs/'assets/site.css')
          # Remove the accidental continuous-scroll overlay and obsolete compressed loader payload.
          for p in [docs/'v19.js',docs/'v19.css',docs/'site-a.b64']:
              p.unlink(missing_ok=True)
          shutil.rmtree(docs/'site',ignore_errors=True)
          shutil.rmtree(stage,ignore_errors=True)
          shutil.rmtree(tmp,ignore_errors=True)
          PY
      - name: Validate published tree before commit
        shell: bash
        run: |
          node --check docs/assets/app.js
          grep -q 'time-machine.html' docs/index.html
          grep -q 'chronicle.html' docs/index.html
          ! grep -Rqi 'tracked union' docs/assets docs/*.html
          ! grep -Rqi 'Dikste Jr' docs/assets docs/*.html
      - name: Commit corrected v19
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs .v19publish
          if git diff --cached --quiet; then
            echo 'No site changes.'
            exit 0
          fi
          git commit -m 'Publish corrected United Gimps v19 multi-page site'
          git push
