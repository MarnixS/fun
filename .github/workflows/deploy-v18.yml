name: Publish United Gimps site

on:
  workflow_dispatch:
  push:
    paths:
      - '.v18payload/READY'

permissions:
  contents: write

concurrency:
  group: united-gimps-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct site payload
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          from pathlib import Path
          root=Path('.v18payload')
          parts=sorted(root.glob('chunk-*.txt'))
          if len(parts) != 20:
              raise SystemExit(f'Expected 20 verified v19 chunks, found {len(parts)}')
          packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(packed, validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')
          print('Extracted',len(raw),'compressed bytes from',len(parts),'chunks')
          PY

      - name: Remove staging and legacy payloads
        shell: bash
        run: |
          rm -rf .v18payload
          rm -rf docs/site docs/site-a.b64
          rm -f docs/img/.keep docs/img/README.txt docs/img/bigdog.webp.b64.tmp docs/img/lijpste.webp.b64.tmp

      - name: Commit published site
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'No site changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish United Gimps v19'
          git push
