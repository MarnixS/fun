name: Publish United Gimps v18

on:
  workflow_dispatch:
  push:
    paths:
      - '.v18payload/READY'

permissions:
  contents: write

concurrency:
  group: united-gimps-v18-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct v18 site
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          from pathlib import Path

          root=Path('.v18payload')
          parts=sorted(root.glob('part-*.txt'))
          if len(parts)!=8:
              raise SystemExit(f'Expected 8 v18 payload parts, found {len(parts)}')
          packed=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(packed)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall('.')
          print('Extracted',len(raw),'compressed bytes')
          PY

      - name: Restore exact player portraits
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          out=Path('docs/img');out.mkdir(parents=True,exist_ok=True)
          images={
          'dikste.webp':'',
          'bigdog.webp':'',
          'lijpste.webp':''}
          for name,data in images.items():
              (out/name).write_bytes(base64.b64decode(data))
              print('Wrote',name,(out/name).stat().st_size,'bytes')
          PY

      - name: Remove staging and legacy payloads
        shell: bash
        run: |
          rm -f docs/img/.keep docs/img/README.txt docs/img/bigdog.webp.b64.tmp docs/img/lijpste.webp.b64.tmp
          rm -rf docs/site docs/site-a.b64
          rm -rf .v18payload

      - name: Commit v18
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs .v18payload
          if git diff --cached --quiet; then
            echo 'v18 already published.'
            exit 0
          fi
          git commit -m 'Publish United Gimps v18'
          git push
