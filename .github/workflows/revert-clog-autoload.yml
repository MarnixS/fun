name: Revert CLog price autoload only

on:
  push:
    paths:
      - '.github/workflows/revert-clog-autoload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revert only the CLog automatic price-loading insertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/assets/app.js')
          s = p.read_text()
          unwanted = "function renderClogItems(m=collectionModel()){const t=$('#clogItemTable');if(!t)return;if(state.priceStatus==='idle')ensurePrices().then(()=>{renderClogItems();renderClogContribution();});let arr=m.rows.slice()"
          original = "function renderClogItems(m=collectionModel()){const t=$('#clogItemTable');if(!t)return;let arr=m.rows.slice()"
          if unwanted not in s:
              raise SystemExit('Exact unwanted autoload insertion not found; refusing to change anything')
          s = s.replace(unwanted, original, 1)
          p.write_text(s)
          PY
      - name: Verify valuation overrides are untouched
        run: |
          grep -F "function priceFor(id){id=+id;if(id===29799)return 28981998;if(id===29790||id===29792||id===29794)return gePrice(29796)/3;if(id===28319||id===28321||id===28323||id===28325)return gePrice(28338)/4;return gePrice(id)}" docs/assets/app.js
      - name: Commit exact revert
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/assets/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Revert CLog automatic price loading only"
          git push
