name: Publish final United Gimps v19

on:
  push:
    paths:
      - '.v19final/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: united-gimps-v19-final
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack exact final v19
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, shutil, tarfile
          from pathlib import Path
          stage=Path('.v19final')
          names=[f'part-{i:02d}.txt' for i in range(30)]
          missing=[n for n in names if not (stage/n).exists()]
          if missing:
              raise SystemExit('Missing final v19 parts: '+', '.join(missing))
          pieces=[]
          for i,n in enumerate(names):
              expected=3640 if i==29 else 6000
              text=(stage/n).read_text(encoding='utf-8').strip()
              if len(text)<expected:
                  raise SystemExit(f'{n} truncated: {len(text)} < {expected}')
              pieces.append(text[:expected])
          packed=''.join(pieces)
          raw=base64.b64decode(packed,validate=True)
          sha=hashlib.sha256(raw).hexdigest()
          expected_sha='65824bda7ab4fcc3f86a148dd5d6376544821e2ffd37a56d0216b7cc1c173428'
          if sha!=expected_sha:
              raise SystemExit(f'Final package checksum mismatch: {sha}')
          print(f'Final package verified: {len(raw)} bytes, sha256={sha}')
          tmp=Path('.v19-final-unpack'); shutil.rmtree(tmp,ignore_errors=True); tmp.mkdir()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tf:
              tf.extractall(tmp)
          required=['index.html','gim.html','hiscores.html','progress.html','time-machine.html','chronicle.html','history.html','assets/app.js','assets/site.css']
          absent=[n for n in required if not (tmp/n).is_file()]
          if absent:
              raise SystemExit('Package missing: '+', '.join(absent))
          docs=Path('docs'); (docs/'assets').mkdir(parents=True,exist_ok=True)
          for n in required:
              dst=docs/n; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(tmp/n,dst)
          # Preserve docs/data and the authoritative external banner/crest.
          # Portraits for every member are embedded in app.js from the supplied v19 source.
          for p in [docs/'v19.js',docs/'v19.css',docs/'site-a.b64']:
              p.unlink(missing_ok=True)
          shutil.rmtree(docs/'site',ignore_errors=True)
          shutil.rmtree('.v19publish',ignore_errors=True)
          shutil.rmtree('.v18payload',ignore_errors=True)
          shutil.rmtree(stage,ignore_errors=True)
          shutil.rmtree(tmp,ignore_errors=True)
          PY

      - name: Validate final multi-page site
        shell: bash
        run: |
          node --check docs/assets/app.js
          for page in index gim hiscores progress time-machine chronicle history; do test -s "docs/${page}.html"; done
          grep -q "name:'Dikste'" docs/assets/app.js
          grep -q "name:'Big Dog Aura'" docs/assets/app.js
          grep -q "name:'Lijpste'" docs/assets/app.js
          grep -q "name:'Poep Aura'" docs/assets/app.js
          grep -q "name:'Lompste'" docs/assets/app.js
          grep -q "renderFiveStanding" docs/assets/app.js
          grep -q "templeCoverage" docs/assets/app.js
          grep -q "Collection Log currently unsynced" docs/assets/app.js
          grep -q 'time-machine.html' docs/index.html
          grep -q 'chronicle.html' docs/index.html
          test -s docs/img/united-gimps-banner.webp
          test -s docs/img/gim-crest.svg
          ! grep -Rqi 'Dikste Jr' docs/assets docs/*.html
          ! grep -Rqi 'tracked union' docs/assets docs/*.html
          ! grep -R "key !== 'lompste'\|key!='lompste'\|key != 'lompste'" docs/assets docs/*.html
          echo 'Final v19 validation passed.'

      - name: Commit final v19
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs .v19final .v19publish .v18payload
          if git diff --cached --quiet; then
            echo 'No site changes.'
            exit 0
          fi
          git commit -m 'Publish final United Gimps v19 multi-page site'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
