name: Validate United Gimps v19

on:
  push:
    paths:
      - '.github/workflows/validate-v19.yml'
      - 'docs/v19.js'
      - 'docs/v19.css'
      - 'docs/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check docs/v19.js
      - name: Structural assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('docs/v19.js').read_text(encoding='utf-8')
          css=Path('docs/v19.css').read_text(encoding='utf-8')
          loader=Path('docs/index.html').read_text(encoding='utf-8')
          required=['Dikste','Big Dog Aura','Lijpste','Lompste','Dikste Jr','Group Ironman Tracker','Chronicle','weighted unique contribution','prices.runescape.wiki','static.runelite.net']
          missing=[x for x in required if x not in js]
          assert not missing, f'Missing v19 features: {missing}'
          assert 'v19.js?v=19' in loader and 'v19.css?v=19' in loader
          assert '.v19-five-grid' in css and '.v19-contrib' in css
          print('v19 structural validation passed')
          PY
